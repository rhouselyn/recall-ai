[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-ai"
version = "0.2.0"
description = "Recall AI - 本地收藏目录与统一只读查询"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
# 与 tests/mcp_stdio_probe.py 实测版本一致。
mcp = ["mcp==2.3.0"]
# 本地媒体提取：复用本机既有模型权重，运行时只读。
media = ["rapidocr-onnxruntime==1.4.4", "sherpa-onnx==2.0.1", "av>=18"]
# 平台登录网页连接器使用的独立浏览器资料档。
browser = ["playwright>=1.50"]
youtube = ["yt-dlp>=2026.10.26"]
dev = ["pytest>=8"]

[project.scripts]
recall = "recall.cli:main"

[tool.setuptools]
packages = ["recall", "recall.media", "recall.sources", "recall.frontend", "recall.bookmarks_extension"]

[tool.setuptools.package-dir]
"" = "src"
"recall.frontend" = "frontend"
"recall.bookmarks_extension" = "extensions/bookmarks"

[tool.setuptools.package-data]
"recall.frontend" = ["*.html", "*.js", "*.css", "assets/*"]
"recall.bookmarks_extension" = ["manifest.json", "options.html", "options.js", "service_worker.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
